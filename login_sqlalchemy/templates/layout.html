<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <!-- <link href="{{ url_for('serve_npm_package', package='bootstrap', filename='dist/css/bootstrap.min.css')}}"
        rel="stylesheet"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div id="msgbox-area">
            {% for message in messages %}
            <button class="message-box-trigger" onclick="msgbox.show('{{ message }}',null,'Close')"></button>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    {{routes}}
    <!-- <script src="{{ url_for('serve_npm_package', package='bootstrap', filename='dist/js/bootstrap.min.js')}}"></script> -->
    <script src="{{ url_for('static', filename='script.js')}}"></script>
</body>

</html>
